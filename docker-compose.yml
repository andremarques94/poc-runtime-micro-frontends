services:
  api-seed:
    profiles: ["seed"]
    build:
      context: .
      target: api
    environment:
      SQLITE_PATH: /data/app.db
    volumes:
      - api-data:/data
    command: ["node", "dist/scripts/seed.js"]

  api:
    build:
      context: .
      target: api
    environment:
      PORT: "3000"
      SQLITE_PATH: /data/app.db
    volumes:
      - api-data:/data
    command: ["node", "dist/index.js"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  checkout:
    build:
      context: .
      target: checkout
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  registry:
    build:
      context: .
      target: registry
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      target: web
    environment:
      API_UPSTREAM: api:3000
      CHECKOUT_UPSTREAM: checkout:8080
      REGISTRY_UPSTREAM: registry:8080
    depends_on:
      api:
        condition: service_healthy
      checkout:
        condition: service_healthy
      registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  api-data:
